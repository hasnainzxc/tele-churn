[project]
name = "tele-churn"
version = "0.1.0"
description = "TeleConnect churn prediction & retention agent"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "imbalanced-learn>=0.11",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.50",
    "streamlit>=1.35",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "jupyter>=1.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
